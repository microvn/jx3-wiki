name: Kiểm tra wiki

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kiem-tra:
    name: Kiểm tra bài viết
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Kiểm tra bài viết
        run: node scripts/check-wiki.mjs

  cap-nhat-web:
    name: Báo web build lại
    needs: kiem-tra
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Gọi Vercel deploy hook
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Chưa đặt secret VERCEL_DEPLOY_HOOK, bỏ qua."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" -o /dev/null
          echo "Đã gọi deploy hook."
